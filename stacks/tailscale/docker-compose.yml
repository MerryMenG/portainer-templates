---
version: "3.7"
services:
  tailscale:
    container_name: tailscale
    image: tailscale/tailscale:stable
    hostname: ${HOSTNAME}
    mac_address: ${MAC_ADDRESS}
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    volumes:
      - /portainer/Files/AppData/Config/tailscale:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    restart: unless-stopped
    networks:
      vlan:
        ipv4_address: ${STATIC_IP}

networks:
 vlan:
    driver: macvlan
    driver_opts:
      parent: ${NETWORK_DEVICE}
    ipam:
       driver: default
       config:
        - subnet: ${SUBNET}
          gateway: ${GATEWAY}
